<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小米 SU7 车模（纯净展示版）</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1014;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #e8eaed;
    }

    #sketch {
      position: fixed;
      inset: 0;
    }

    #sketch canvas {
      display: block;
      width: 100%;
      height: 100%;
      /* 车模悬浮在渐变背景上，无地面、无隧道、无音乐 */
      background: radial-gradient(ellipse at 50% 45%, #22282f 0%, #12161b 55%, #0b0e12 100%);
    }

    /* 后期电池包控制面板的挂载位，默认空置 */
    #panel {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 20;
      max-width: 340px;
    }

    .hint {
      position: fixed;
      left: 24px;
      bottom: 20px;
      font-size: 12px;
      line-height: 1.7;
      opacity: .5;
      z-index: 20;
      pointer-events: none;
    }

    .loader-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1014;
      transition: opacity .6s ease;
      font-size: 13px;
      letter-spacing: .3em;
    }

    .loader-screen.hollow {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="sketch"></div>
    <div id="panel"></div>
    <div class="hint">左键拖拽旋转 · 滚轮缩放 · 右键平移<br />URL 加 #front / #side / #rear 可切换机位</div>
    <div class="loader-screen" id="loader">LOADING CAR MODEL</div>
  </div>
  <script type="module" src="/src/car.ts"></script>
  <script type="module" src="/src/panel-bridge.ts"></script>
</body>

</html>
